name: Vehicle advert service checks
on:
  push:
    branches: [feature/vehicle-advert-management]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Export review snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-advert-review
          path: |
            netlify-site
            migration
            package.json
            package-lock.json
            netlify.toml
          retention-days: 3
